<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RipSave — Вход</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">🛡️ RipSave</div>
            <h1>Вход в консоль</h1>
            <p>Введите ключ доступа для подключения к боту</p>
            
            <div class="input-group">
                <input type="text" id="keyInput" placeholder="Ключ доступа (ADMIN_...)" />
                <button id="connectBtn">Подключиться</button>
            </div>
            
            <div id="status" class="status"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
