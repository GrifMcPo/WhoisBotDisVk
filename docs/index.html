<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whois Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="app">
        <!-- Страница входа -->
        <div id="loginPage">
            <div class="login-box">
                <h1>🔐 Whois Admin</h1>
                <p>Введите ключ доступа</p>
                <input type="text" id="keyInput" placeholder="ADMIN_XXXXX">
                <button onclick="login()">Войти</button>
                <div id="loginError" class="error"></div>
            </div>
        </div>

        <!-- Админ-панель -->
        <div id="adminPage" style="display:none">
            <header>
                <h1>🚀 Whois Admin</h1>
                <button onclick="logout()" class="logout-btn">Выйти</button>
            </header>
            
            <nav class="tabs">
                <button class="tab active" data-tab="logs" onclick="showTab('logs')">📋 Логи</button>
                <button class="tab" data-tab="users" onclick="showTab('users')">👥 Пользователи</button>
                <button class="tab" data-tab="bans" onclick="showTab('bans')">⛔ Баны</button>
                <button class="tab" data-tab="settings" onclick="showTab('settings')">⚙️ Настройки</button>
            </nav>

            <div id="logsTab" class="tab-content">
                <h2>📋 Логи команд</h2>
                <div id="logsList"></div>
            </div>

            <div id="usersTab" class="tab-content" style="display:none">
                <h2>👥 Список пользователей</h2>
                <div id="usersList"></div>
            </div>

            <div id="bansTab" class="tab-content" style="display:none">
                <h2>⛔ Управление банами</h2>
                <div id="bansList"></div>
            </div>

            <div id="settingsTab" class="tab-content" style="display:none">
                <h2>⚙️ Настройки бота</h2>
                <button onclick="toggleTech()" id="techBtn">Включить техработы</button>
                <p id="techStatus">Техработы: выключены</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
